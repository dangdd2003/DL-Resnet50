# ImageNet-pretrained ResNet-50: train the new head (backbone frozen), then fine-tune the
# top 30 backbone layers (BatchNorm stays frozen) at a 100x lower learning rate.
data:
  data_dir: data/hymenoptera
  train_split: train
  val_split: val
  test_split: null
  image_size: [224, 224]
  batch_size: 16
  seed: 42
  augmentation:
    horizontal_flip: true
    rotation_degrees: 20
    translation: 0.2
model:
  arch: resnet50_transfer
  weights: imagenet
  freeze_backbone: true
  dropout: 0.2
train:
  epochs: 10
  optimizer: sgd
  learning_rate: 1.0e-3
  momentum: 0.9
  weight_decay: 0.0
  schedule: step
  drop_every_epochs: 7
  drop_factor: 0.1
  warmup_epochs: 0
  fine_tune_epochs: 10
  fine_tune_layers: 30
  fine_tune_learning_rate: 1.0e-5
  output_dir: runs
  run_name: ant_bee_transfer
